services:

  # --- Kafka (KRaft, kein Zookeeper) ---
  # License hygiene: Apache 2.0 (apache/kafka) instead of Confluent Community License (confluentinc/cp-kafka)
  moe-kafka:
    image: apache/kafka:3.7.1
    container_name: moe-kafka
    restart: always
    healthcheck:
      # TCP probe on the broker port (image has bash, no nc) — detects hangs.
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/9092"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT}:9092"
    environment:
      CLUSTER_ID: "moe-kafka-cluster-01"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@moe-kafka:9093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://moe-kafka:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 536870912
      KAFKA_LOG_DIRS: "/var/lib/kafka/data"
      # Reduce GC-pause-induced heartbeat timeouts on single-node KRaft.
      # Heartbeat request timeout = interval * 2 + 500ms; 5000 → 10500ms headroom.
      KAFKA_BROKER_HEARTBEAT_INTERVAL_MS: "5000"
      KAFKA_BROKER_SESSION_TIMEOUT_MS: "30000"
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m -XX:MaxGCPauseMillis=100 -XX:+UseG1GC"
    volumes:
      - ${MOE_DATA_ROOT}/kafka-data:/var/lib/kafka/data
    deploy:
      resources:
        limits:
          cpus: '${KAFKA_CPU_LIMIT}'
          memory: 2G
  # --- Neo4j Knowledge Graph (GraphRAG + Ontologie) ---
  neo4j-knowledge:
    image: neo4j:5-community
    container_name: neo4j-knowledge
    profiles: [neo4j]
    restart: always
    healthcheck:
      # TCP probe on the Bolt port (image has bash) — detects Bolt hangs.
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/7687"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT}:7474"   # Browser UI
      - "127.0.0.1:${NEO4J_BOLT_PORT}:7687"   # Bolt
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASS}
      # Sovereignty: disable anonymous usage-data reporting to neo4j.com
      - NEO4J_dbms_usage__report_enabled=false
      - NEO4J_server_memory_heap_initial__size=512m
      - NEO4J_server_memory_heap_max__size=1g
      - NEO4J_server_memory_pagecache_size=512m
      - NEO4J_db_tx__log_rotation_retention__policy=2 files
    volumes:
      - ${MOE_DATA_ROOT}/neo4j-data:/data
      - ${MOE_DATA_ROOT}/neo4j-logs:/logs
    deploy:
      resources:
        limits:
          cpus: '${NEO4J_CPU_LIMIT}'
          memory: 8G

  # --- MCP Precision Tools Server ---
  mcp-precision:
    build:
      context: .
      dockerfile: mcp_server/Dockerfile
    container_name: mcp-precision
    restart: always
    ports:
      - "127.0.0.1:${MCP_HOST_PORT}:8003"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c 'import server'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    env_file:
      - .env
    volumes:
      - ${MOE_DATA_ROOT}/generated:/app/generated:rw,noexec,nosuid
    environment:
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=neo4j
      - NEO4J_PASS=${NEO4J_PASS}
      - ORCHESTRATOR_URL=http://langgraph-orchestrator:8000
      - RUST_COMPILE_SANDBOX_URL=http://rust-compile-sandbox:8080
      - RUST_LOOM_SANDBOX_URL=http://rust-loom-sandbox:8080
    networks:
      - default                  # internet egress for its own tools (Wikipedia, PubMed, etc.)
      - rust_compile_internal    # reach rust-compile-sandbox on its egress-blocked network
      - rust_loom_internal       # reach rust-loom-sandbox on its egress-blocked network

  # Isolated, egress-blocked Rust type/borrow-check sandbox for the
  # rust_compile_check precision tool -- compiles untrusted, model-generated
  # source with `rustc --emit=metadata` (analysis only, no codegen/link, and
  # the compiled artifact is never executed). See docs/experiments/
  # lumig_posttraining_candidates.md for the motivating evidence.
  rust-compile-sandbox:
    build:
      context: .
      dockerfile: services/rust_compile_sandbox/Dockerfile
    container_name: rust-compile-sandbox
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=64m
    # No .env, no network egress: this service only ever sees a source-code
    # string over HTTP from mcp-precision and never needs external state.
    networks:
      - rust_compile_internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M

  # Phase 2 of the Rust code-quality-in-the-loop feature: unlike
  # rust-compile-sandbox (type/borrow-check only, never executes), this
  # container actually RUNS the submitted code under Loom's concurrency
  # model checker, which is the only way to catch a memory-ordering data
  # race -- that class of bug still compiles cleanly (see docs/experiments/
  # lumig_posttraining_candidates.md). Kept as its own container and network
  # (not an extension of rust-compile-sandbox) specifically so a bug in this
  # new, higher-risk execution path can never compromise the already-proven
  # compile-only checker the rest of the system depends on.
  rust-loom-sandbox:
    build:
      context: .
      dockerfile: services/rust_loom_sandbox/Dockerfile
    container_name: rust-loom-sandbox
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      # Unlike rust-compile-sandbox's tmpfs, this one must allow exec: Loom
      # has to actually run the compiled test binary to explore interleavings,
      # not just type-check it. size is generous because a `cargo test
      # --release` build of even a tiny crate against the pre-cached loom
      # dependency still produces a non-trivial target/ directory per request.
      - /build:exec,nosuid,size=1024m
    # No .env, no network egress: identical isolation posture to
    # rust-compile-sandbox, just with an exec-capable scratch dir instead of
    # a noexec one.
    networks:
      - rust_loom_internal
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 768M
          pids: 128

  # --- LangGraph Orchestrator (Dein Kern-System) ---
  langgraph-app:
    image: moe-sovereign-orchestrator:local
    build:
      context: .
      dockerfile: Dockerfile
      # Set GIT_REVISION=$(git rev-parse HEAD) in the shell before `docker
      # compose build` to stamp the image with the actual source commit
      # (exposed at runtime via GET /health). No CI pipeline wires this
      # automatically yet — omitting it just builds "unknown", same as before.
      args:
        GIT_REVISION: ${GIT_REVISION:-unknown}
    container_name: langgraph-orchestrator
    restart: always
    healthcheck:
      # Hits the FastAPI /health endpoint (python3 is present; image has no curl).
      test: ["CMD", "python3", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health',timeout=4).status==200 else 1)"]
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 90s
    ports:
      - "${LANGGRAPH_HOST_PORT}:8000"
    networks:
      - default          # internet egress + all other services (kafka, neo4j, redis, ...)
      - chroma_internal  # reach chromadb-vector on its egress-blocked network
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: '${LANGGRAPH_CPU_LIMIT}'
          memory: 6G
        reservations:
          memory: 512M
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}@terra_cache:6379
      - POSTGRES_CHECKPOINT_URL=postgresql://langgraph:${POSTGRES_CHECKPOINT_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}@terra_checkpoints:5432/langgraph
      - MOE_USERDB_URL=postgresql://moe_admin:${MOE_USERDB_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}@terra_checkpoints:5432/moe_userdb
      - CHROMA_HOST=chromadb-vector
      - CHROMA_PORT=8000
      - MCP_URL=http://mcp-precision:8003
      - PRECISION_DIRECT_RESPONSE_ENABLED=${PRECISION_DIRECT_RESPONSE_ENABLED:-true}
      # Exact precision answers are evidence-bound but the current read path
      # cannot yet reconstruct and revalidate their typed evidence envelope.
      # Keep response caching disabled until that reader contract exists.
      - PRECISION_CACHE_POLICY=${PRECISION_CACHE_POLICY:-bypass}
      - PRECISION_CONTRACT_MODE=${PRECISION_CONTRACT_MODE:-enforce}
      - MCP_STRUCTURED_RESULT_REQUIRED=${MCP_STRUCTURED_RESULT_REQUIRED:-true}
      - NEO4J_URI=${NEO4J_URI}
      - NEO4J_USER=neo4j
      - CONVERSATION_LOG_DIR=/app/logs/users
      - CONVERSATION_LOG_ENABLED=${CONVERSATION_LOG_ENABLED}
      - CONVERSATION_LOG_RETENTION_DAYS_DEFAULT=${CONVERSATION_LOG_RETENTION_DAYS_DEFAULT}
      - CONVERSATION_LOG_RETENTION_MAX=${CONVERSATION_LOG_RETENTION_MAX}
      - NEO4J_PASS=${NEO4J_PASS}
      - KAFKA_URL=kafka://moe-kafka:9092
      # Tier 2-4 long-term memory for CC sessions (Tier-2 ChromaDB warm, Tier-3 context-index, Tier-4 Neo4j).
      # Per-profile opt-out: set long_memory=false in the CC profile JSON.
      - CC_CONTEXT_INDEX_ENABLED=true
      # Tier-2 semantic memory: dedicated CPU embed sidecar — no inference-GPU load.
      # context_index.py (Tier-3) uses in-process ONNX and ignores these vars.
      - SEMANTIC_MEMORY_EMBED_URL=http://moe-embed:11434
      - SEMANTIC_MEMORY_EMBED_MODEL=${SEMANTIC_MEMORY_EMBED_MODEL:-ollama:nomic-embed-text}
      # Set to /app/hermes-workspaces when HERMES_KANBAN_WORKSPACES_HOST is configured.
      # Empty string disables workspace file writing in the kanban two-phase handler.
      - HERMES_KANBAN_WORKSPACES=${HERMES_KANBAN_WORKSPACES_HOST:+/app/hermes-workspaces}
      # LITELLM_URL aktiviert das Unified API Gateway (leer = direkter Ollama-Zugriff als Fallback)
      # - LITELLM_URL=http://litellm-proxy:4000
    volumes:
      - ${MOE_DATA_ROOT}/agent-logs:/app/logs
      - ${MOE_DATA_ROOT}/user-audit-logs:/app/logs/users:rw
      - ${MOE_DATA_ROOT}/chroma-onnx-cache:/app/.cache/chroma
      - ./.env:/app/.env:ro
      - ${CLAUDE_SKILLS_DIR:-./skills}:/app/skills:ro
      # Application Python sources are copied as one coherent snapshot by the
      # image build. Never bind-mount only one package: mixing current
      # services/ with stale graph/, main.py or tool_injector.py caused live
      # import failures after otherwise successful planning.
      - ./data:/app/data:rw
      - ./scripts:/app/scripts:ro
      - ${HERMES_KANBAN_WORKSPACES_HOST:-/tmp/moe-kanban-workspaces}:/app/hermes-workspaces:rw
      - ./models:/app/models:ro
      - ${MOE_DATA_ROOT}/cleanup-config.json:/app/cleanup-config.json:ro
      - ${MOE_DATA_ROOT}/cleanup-history.jsonl:/app/cleanup-history.jsonl:rw
      - ${MOE_DATA_ROOT}/backups/auto:/app/backups:rw
    depends_on:
      terra_cache:
        condition: service_started
      terra_checkpoints:
        condition: service_healthy
      chromadb-vector:
        condition: service_started
      mcp-precision:
        condition: service_started
      moe-kafka:
        condition: service_started
      moe-embed:
        condition: service_healthy

  # Safe periodic learning/maintenance jobs. HABE publishes atomically;
  # graph decay is dry-run unless an operator explicitly enables deletion;
  # Eurisko template mutation is opt-in because it changes active policies.
  moe-maintenance:
    image: moe-sovereign-orchestrator:local
    build:
      context: .
      dockerfile: Dockerfile
    container_name: moe-maintenance
    restart: unless-stopped
    command: ["python", "-u", "scripts/maintenance_scheduler.py"]
    env_file:
      - .env
    environment:
      - MOE_USERDB_URL=postgresql://moe_admin:${MOE_USERDB_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}@terra_checkpoints:5432/moe_userdb
      - HABE_SCHEDULER_ENABLED=${HABE_SCHEDULER_ENABLED:-1}
      - HABE_REBUILD_INTERVAL_SECONDS=${HABE_REBUILD_INTERVAL_SECONDS:-86400}
      - GRAPH_DECAY_SCHEDULER_ENABLED=${GRAPH_DECAY_SCHEDULER_ENABLED:-1}
      - GRAPH_DECAY_INTERVAL_SECONDS=${GRAPH_DECAY_INTERVAL_SECONDS:-86400}
      - GRAPH_DECAY_APPLY=${GRAPH_DECAY_APPLY:-0}
      - EURISKO_SCHEDULER_ENABLED=${EURISKO_SCHEDULER_ENABLED:-0}
      - EURISKO_INTERVAL_SECONDS=${EURISKO_INTERVAL_SECONDS:-21600}
      - KNOWLEDGE_INGESTION_SCHEDULER_ENABLED=${KNOWLEDGE_INGESTION_SCHEDULER_ENABLED:-1}
      - KNOWLEDGE_INGESTION_INTERVAL_SECONDS=${KNOWLEDGE_INGESTION_INTERVAL_SECONDS:-300}
      - MAINTENANCE_INITIAL_DELAY_SECONDS=${MAINTENANCE_INITIAL_DELAY_SECONDS:-30}
      - MAINTENANCE_STATUS_FILE=/app/logs/maintenance-status.json
    volumes:
      - ./.env:/app/.env:ro
      - ./scripts:/app/scripts:ro
      - ./models:/app/models:rw
      - ./data:/app/data:rw
      - ${MOE_DATA_ROOT}/agent-logs:/app/logs:rw
    depends_on:
      terra_checkpoints:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import json,os,time; p='/app/logs/maintenance-status.json'; d=json.load(open(p)); raise SystemExit(0 if time.time()-d['heartbeat'] < 120 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # --- Postgres (LangGraph checkpoints via AsyncPostgresSaver) ---
  # Dedicated instance — keeps checkpoint data isolated from authentik-postgresql.
  terra_checkpoints:
    image: postgres:17-alpine
    container_name: terra_checkpoints
    restart: always
    environment:
      - POSTGRES_USER=langgraph
      - POSTGRES_PASSWORD=${POSTGRES_CHECKPOINT_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}
      - POSTGRES_DB=langgraph
      # Consumed by scripts/postgres-init/01-moe_admin.sh on first init only
      - MOE_USERDB_PASSWORD=${MOE_USERDB_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}
      # Consumed by scripts/postgres-init/02-libris.sh on first init only (moe-libris federation DB)
      - LIBRIS_DB_PASSWORD=${LIBRIS_DB_PASSWORD}
    volumes:
      - ${MOE_DATA_ROOT}/langgraph-checkpoints:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U langgraph -d langgraph && psql -U langgraph -d moe_userdb -c 'SELECT 1' >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # --- Valkey (cache, moe:active:* keys, semaphores metadata) ---
  # BSD-3-Clause drop-in for Redis. LangGraph checkpoints live in Postgres (terra_checkpoints),
  # not here — valkey-search/RediSearch is not used (requires AVX2 which this host lacks).
  terra_cache:
    image: valkey/valkey:8-alpine
    container_name: terra_cache
    restart: always
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 30s
      timeout: 4s
      retries: 3
      start_period: 10s
    command: [
      "valkey-server",
      "--requirepass", "${REDIS_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}",
      "--appendonly", "yes",
      "--auto-aof-rewrite-percentage", "50",
      "--auto-aof-rewrite-min-size", "32mb",
      "--maxmemory", "400mb",
      "--maxmemory-policy", "allkeys-lru"
    ]
    volumes:
      - ${MOE_DATA_ROOT}/redis-data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # --- ChromaDB (Vektorspeicher für RAG) ---
  chromadb-vector:
    # CVE-2026-45829 "ChromaToast": pre-auth code-injection RCE via trust_remote_code
    # on the collections endpoint. Affects ALL versions >= 1.0.0 — NO patched version
    # exists yet, so this pin is for reproducibility, NOT a fix. Actual mitigation:
    # the server is bound to loopback only (see ports below) and is not reverse-proxied,
    # so the unauthenticated endpoint is unreachable from outside the host. Revisit
    # the pin once upstream ships a patched release.
    #
    # Two further unfixed advisories affect this pin, both about ChromaDB's own
    # multi-tenant RBAC: SimpleRBACAuthorizationProvider doesn't scope a permission to
    # the tenant/database/collection it was granted for, and an authenticated caller
    # can read/write/update/delete data in any tenant's collection. Neither is
    # exploitable here: the app never uses ChromaDB's tenant/database feature (every
    # call goes through `default_tenant`/`default_database`; tenant isolation is
    # enforced at the application layer via `tenant_id` filtering instead), and the
    # network isolation below means the only caller who could reach the API at all
    # is the orchestrator itself.
    image: chromadb/chroma:1.5.9
    container_name: chromadb-vector
    restart: always
    healthcheck:
      # TCP probe on the Chroma API port (image has bash, no curl/wget).
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/localhost/8000"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # No host port published, and attached ONLY to the internal (egress-blocked)
    # chroma_internal network — defence-in-depth for CVE-2026-45829: the server
    # cannot reach the internet to fetch a malicious model repo, and is reachable
    # only by the orchestrator via the `chromadb-vector` DNS name (not a host port).
    networks:
      - chroma_internal
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - ${MOE_DATA_ROOT}/chroma-data:/data
    deploy:
      resources:
        limits:
          cpus: '${CHROMA_CPU_LIMIT}'
          memory: 4G

  # --- Embedding Sidecar (CPU-only, no inference-GPU load) ---
  # Serves nomic-embed-text for Tier-2 semantic memory (memory_retrieval.py).
  # Tier-3 context indexing (context_index.py) uses in-process ONNX instead.
  # OLLAMA_NUM_GPU=0 forces CPU mode regardless of host GPU visibility.
  moe-embed:
    build:
      context: ./services/moe-embed
      dockerfile: Dockerfile
    image: moe-embed:local
    container_name: moe-embed
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_GPU=0
      - OLLAMA_KEEP_ALIVE=24h
      - MOE_EMBED_MODEL=${MOE_EMBED_MODEL:-nomic-embed-text}
    volumes:
      - ${MOE_DATA_ROOT}/embed-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          cpus: '${EMBED_CPU_LIMIT:-2.0}'
          memory: 2G

  # --- Local Inference Engine (Ollama) ---
  moe-ollama:
    image: ollama/ollama:latest
    container_name: moe-ollama
    profiles: [ollama]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_HOST_PORT:-11434}:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_HOST=0.0.0.0
    volumes:
      - ${MOE_DATA_ROOT}/ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # --- Prometheus (Metriken-Scraper) ---
  moe-prometheus:
    image: prom/prometheus:latest
    container_name: moe-prometheus
    profiles: [monitoring]
    restart: always
    ports:
      - "127.0.0.1:${PROMETHEUS_HOST_PORT}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/node_targets.yml:/etc/prometheus/node_targets.yml:ro
      - ./prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - ${MOE_DATA_ROOT}/prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=${PROMETHEUS_RETENTION_DAYS}d'
      - '--web.enable-lifecycle'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # --- Docker Socket Proxy (schützt Docker-Socket vor direktem Zugriff) ---
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    container_name: docker-socket-proxy
    restart: always
    environment:
      CONTAINERS: 1   # GET /containers/*
      STATS: 1        # GET /containers/*/stats
      LOGS: 1         # GET /containers/*/logs (required by Dozzle)
      EVENTS: 1       # GET /events (required by Dozzle real-time)
      VERSION: 1      # GET /version
      PING: 1         # GET /_ping
      POST: 1         # POST /containers/*/restart
      ALLOW_RESTARTS: 1  # required so moe-docs-sync can reload mkdocs serve after updating docs
      IMAGES: 1       # POST /images/prune (required by System Cleanup Manager)
      BUILD: 1        # POST /build/prune  (required by System Cleanup Manager)
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock:ro
    networks:
      - default

  # --- Admin UI (Web-Konfiguration für MoE Sovereign) ---
  moe-admin:
    build:
      context: ./admin_ui
      dockerfile: Dockerfile
    container_name: moe-admin
    restart: always
    ports:
      - "${ADMIN_UI_HOST_PORT}:8088"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE  # required: write to host-mounted .env (owned by host user, not container root)
    env_file:
      - .env
    environment:
      - PROMETHEUS_URL=http://moe-prometheus:9090
      - REDIS_URL=redis://:${REDIS_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}@terra_cache:6379
      - MOE_USERDB_URL=postgresql://moe_admin:${MOE_USERDB_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}@terra_checkpoints:5432/moe_userdb
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
      - POSTGRES_CHECKPOINT_URL=postgresql://langgraph:${POSTGRES_CHECKPOINT_PASSWORD:?}@terra_checkpoints:5432/langgraph
      - CONVERSATION_LOG_DIR=/app/logs/users
      - CONVERSATION_LOG_ENABLED=${CONVERSATION_LOG_ENABLED}
      - CONVERSATION_LOG_RETENTION_DAYS_DEFAULT=${CONVERSATION_LOG_RETENTION_DAYS_DEFAULT}
      - CONVERSATION_LOG_RETENTION_MAX=${CONVERSATION_LOG_RETENTION_MAX}
    volumes:
      - ./.env:/app/.env:rw
      - ./.moe-services.json:/app/.moe-services.json:ro
      - ./services:/app/services:ro
      - ./data:/app/data:rw
      - ./admin_ui/app.py:/app/app.py:ro
      - ./admin_ui/database.py:/app/database.py:ro
      - ./admin_ui/templates:/app/templates:ro
      - ./admin_ui/lang:/app/lang:ro
      - ${CLAUDE_SKILLS_DIR:-./skills}:/app/skills:rw
      - ./skills-upstream:/app/skills-upstream:rw
      - ${MOE_DATA_ROOT}/admin-logs:/app/logs:rw
      - ${MOE_DATA_ROOT}/user-audit-logs:/app/logs/users:rw
      - ./grafana/dashboards:/app/grafana/dashboards:rw
      - ./prometheus/prometheus.yml:/app/prometheus/prometheus.yml:rw
      - ${MOE_DATA_ROOT}/gap-healer-stats:/app/gap-healer-stats:ro
      - ./benchmarks:/app/benchmarks:rw
      - ${MOE_DATA_ROOT}/cleanup-config.json:/app/cleanup-config.json:rw
      - ${MOE_DATA_ROOT}/cleanup-history.jsonl:/app/cleanup-history.jsonl:rw
      - ${MOE_DATA_ROOT}/checkpoint-archives:/app/checkpoint-archives:rw
      - ${MOE_DATA_ROOT}/backups/auto:/app/backups:rw
    depends_on:
      langgraph-app:
        condition: service_started
      terra_cache:
        condition: service_started
      terra_checkpoints:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
      # Explicit transitive deps of langgraph-app: podman-compose cannot resolve
      # multi-level depends_on chains and errors on "not found in input list".
      mcp-precision:
        condition: service_started
      chromadb-vector:
        condition: service_started
      moe-kafka:
        condition: service_started
    networks:
      - default
      - authentik_network   # server-side token exchange with authentik-server
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  # --- Grafana (Visualisierung & Dashboards) ---
  moe-grafana:
    image: grafana/grafana:latest
    container_name: moe-grafana
    profiles: [monitoring]
    restart: always
    ports:
      - "${GRAFANA_HOST_PORT}:3000"
    user: "472"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?missing — run scripts/install.sh (Linux) or scripts/bootstrap-macos.sh (macOS) first}
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/moe-operations.json
    volumes:
      - ${GRAFANA_DATA_ROOT}/data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ${GRAFANA_DATA_ROOT}/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - moe-prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # --- node-exporter (Host-Metriken: CPU, RAM, Disk, Network) ---
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    profiles: [monitoring]
    restart: always
    ports:
      - "127.0.0.1:${NODE_EXPORTER_HOST_PORT}:9100"
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--collector.netclass.ignored-devices=^(veth|br|docker|lo).*'
    # Podman rootless: prom/node-exporter uses a read-only rootfs; Podman needs
    # a writable /run to inject .containerenv.  A tmpfs satisfies this without
    # granting broader write access to the host filesystem.
    tmpfs:
      - /run
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M

  # --- cAdvisor (Container-Ressourcen-Metriken) ---
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: cadvisor
    profiles: [monitoring]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CADVISOR_HOST_PORT}:8080"
    cap_add:
      - SYS_ADMIN
    # Podman rootless: same tmpfs /run fix as node-exporter (read-only rootfs).
    # /var/run is omitted: on Linux it is a symlink to /run, so mounting it
    # read-only would silently replace the tmpfs and re-introduce the problem.
    # CONTAINER_STORAGE_ROOT must point to the runtime's storage root:
    #   Docker  → /var/lib/docker  (default)
    #   Podman  → ~/.local/share/containers/storage  (rootless default)
    tmpfs:
      - /run
    volumes:
      - /:/rootfs:ro
      - /sys:/sys:ro
      - ${CONTAINER_STORAGE_ROOT}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 256M

  # --- MkDocs Dokumentations-Server ---
  moe-docs:
    image: squidfunk/mkdocs-material:latest
    container_name: moe-docs
    restart: unless-stopped
    ports:
      - "${DOCS_HOST_PORT}:8000"   # Direktzugriff intern: http://localhost:8098
    volumes:
      - .:/docs:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # --- MkDocs Sync-Agent (aktualisiert Status, Experts, Self-Correction alle 15 min) ---
  moe-docs-sync:
    build:
      context: .
      dockerfile: docker/Dockerfile.sync
    container_name: moe-docs-sync
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
    volumes:
      - .:/app
      # podman-compose does not support nested variable substitution; FEW_SHOT_HOST_DIR
      # is always written to .env by install.sh so the fallback is not needed.
      - ${FEW_SHOT_HOST_DIR}:/moe-few-shot:ro
    environment:
      - DOCS_DIR=/app/docs
      - EXPERTS_PATH=/app/prompts/systemprompt
      - PROMETHEUS_URL=http://moe-prometheus:9090
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    command: >
      sh -c "while true; do python /app/sync_agent.py; sleep 900; done"
    depends_on:
      - docker-socket-proxy

  # --- Dozzle Init (generates bcrypt users.yml from .env credentials) ---
  moe-dozzle-init:
    image: python:3.12-alpine
    profiles: [monitoring]
    restart: "no"
    env_file:
      - .env
    environment:
      DOZZLE_USERS_FILE: /data/dozzle-users.yml
    volumes:
      - ${MOE_DATA_ROOT}:/data
      - ./scripts/dozzle-init.sh:/dozzle-init.sh:ro
    command: ["sh", "/dozzle-init.sh"]

  # --- Dozzle (Container Log Viewer) ---
  moe-dozzle:
    image: amir20/dozzle:latest
    container_name: moe-dozzle
    profiles: [monitoring]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DOZZLE_AUTH_PROVIDER: simple
    ports:
      - "127.0.0.1:${DOZZLE_HOST_PORT}:8080"   # local access: http://localhost:9999
    volumes:
      - ${DOCKER_SOCKET}:/var/run/docker.sock:ro
      - ${MOE_DATA_ROOT}/dozzle-users.yml:/data/users.yml:ro
    depends_on:
      moe-dozzle-init:
        condition: service_completed_successfully
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 128M

  # --- AKHQ (Apache Kafka GUI for topic, lag, and event debugging) ---
  moe-akhq:
    image: tchiotludo/akhq:latest
    container_name: moe-akhq
    profiles: [monitoring, akhq]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            moe-kafka:
              properties:
                bootstrap.servers: "moe-kafka:9092"
    ports:
      - "127.0.0.1:${AKHQ_HOST_PORT:-8085}:8080"
    depends_on:
      moe-kafka:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # --- Splash — JavaScript-capable headless browser for MCP web_browser tool ---
  # Renders JS-heavy pages (BBC scripts, British Museum collection, GitHub issues)
  # that SearXNG's static indexer cannot handle. Lightweight (<200MB), REST API.
  moe-splash:
    image: scrapinghub/splash:latest
    container_name: moe-splash
    restart: unless-stopped
    command: --maxrss 512 --slots 4
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  # --- JupyterLab (server-side Python kernel for the Admin Notebook) ---
  # --- Garage (S3-compatible object store, AGPLv3) ---
  # Replaces MinIO after its 2026-04-25 archival.
  # Developed by Deuxfleurs (French non-profit) — aligns with our EU
  # sovereignty posture. Drop-in S3 API on port 3900; admin API on 3903.
  moe-storage-garage:
    image: dxflrs/garage:v1.0.1
    container_name: moe-storage-garage
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ${MOE_DATA_ROOT}/garage/meta:/var/lib/garage/meta
      - ${MOE_DATA_ROOT}/garage/data:/var/lib/garage/data
      - ${MOE_DATA_ROOT}/garage/etc/garage.toml:/etc/garage.toml:ro
    ports:
      - "3900:3900"   # S3 API
      - "3903:3903"   # admin API
    healthcheck:
      # Garage image is distroless (no shell/wget). Binary lives at /garage (not in PATH).
      # `garage status` exits 0 when the node is operational.
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # --- Caddy Reverse Proxy ---
  # Uses host networking so Caddy binds directly to host ports 80/443 without
  # requiring iptables/nftables DNAT rules.  Backends are reached via their
  # host-mapped ports (localhost:<port>) — independent of which Podman bridge
  # or netavark network the backend containers are in.
  # NOTE: network_mode: host requires a Linux host. On macOS (Docker Desktop)
  # host networking is silently ignored; local dev requires a different Caddyfile.
  # Only started when COMPOSE_PROFILES includes "caddy" (set by install.sh).
  moe-caddy:
    image: caddy:2-alpine
    container_name: moe-caddy
    profiles: [caddy]
    restart: unless-stopped
    network_mode: "host"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./install.sh:/srv/install.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - moe-docs
      - moe-dozzle
      - moe-dozzle-init   # explicit transitive dep — podman-compose dependency graph fix

  # --- Authentik SSO Stack ---
  # All four services are started when COMPOSE_PROFILES includes "authentik".
  # Set by install.sh; to add manually: echo 'COMPOSE_PROFILES=authentik' >> .env
  # then re-run: sudo <compose> --profile authentik up -d

  authentik-postgresql:
    image: postgres:16-alpine
    container_name: authentik-postgresql
    profiles: [authentik]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTHENTIK_POSTGRESQL__USER}
      POSTGRES_DB: ${AUTHENTIK_POSTGRESQL__NAME}
      POSTGRES_PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
    volumes:
      - ${MOE_DATA_ROOT}/authentik/postgres:/var/lib/postgresql/data
    networks:
      - authentik_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTHENTIK_POSTGRESQL__USER}"]
      interval: 30s
      timeout: 10s
      retries: 5

  # License hygiene: Valkey (BSD-3-Clause) instead of Redis (SSPL/RSALv2 ≥ 7.4)
  authentik-redis:
    image: valkey/valkey:8-alpine
    container_name: authentik-redis
    profiles: [authentik]
    restart: unless-stopped
    command: --save 60 1 --loglevel warning
    volumes:
      - ${MOE_DATA_ROOT}/authentik/redis:/data
    networks:
      - authentik_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  authentik-server:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: authentik-server
    profiles: [authentik]
    restart: unless-stopped
    command: server
    env_file:
      - .env   # provides AUTHENTIK_BOOTSTRAP_EMAIL/PASSWORD directly
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED}
      TZ: ${TZ}
    volumes:
      - ${MOE_DATA_ROOT}/authentik/media:/media
      - ${MOE_DATA_ROOT}/authentik/custom-templates:/templates
      - ${MOE_DATA_ROOT}/authentik/blueprints:/blueprints/custom:ro
    ports:
      - "${AUTHENTIK_HTTP_PORT}:9000"
      - "${AUTHENTIK_HTTPS_PORT}:9443"
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - authentik_network
      - default

  authentik-worker:
    image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG}
    container_name: authentik-worker
    profiles: [authentik]
    restart: unless-stopped
    command: worker
    user: root
    env_file:
      - .env   # provides AUTHENTIK_BOOTSTRAP_EMAIL/PASSWORD directly
    environment:
      AUTHENTIK_SECRET_KEY: ${AUTHENTIK_SECRET_KEY}
      AUTHENTIK_REDIS__HOST: authentik-redis
      AUTHENTIK_POSTGRESQL__HOST: authentik-postgresql
      AUTHENTIK_POSTGRESQL__USER: ${AUTHENTIK_POSTGRESQL__USER}
      AUTHENTIK_POSTGRESQL__NAME: ${AUTHENTIK_POSTGRESQL__NAME}
      AUTHENTIK_POSTGRESQL__PASSWORD: ${AUTHENTIK_POSTGRESQL__PASSWORD}
      AUTHENTIK_ERROR_REPORTING__ENABLED: ${AUTHENTIK_ERROR_REPORTING__ENABLED}
      TZ: ${TZ}
    volumes:
      - ${MOE_DATA_ROOT}/authentik/certs:/certs
      - ${MOE_DATA_ROOT}/authentik/media:/media
      - ${MOE_DATA_ROOT}/authentik/custom-templates:/templates
      - ${MOE_DATA_ROOT}/authentik/blueprints:/blueprints/custom:ro
      - ${DOCKER_SOCKET}:/var/run/docker.sock
    depends_on:
      authentik-postgresql:
        condition: service_healthy
      authentik-redis:
        condition: service_healthy
    networks:
      - authentik_network

volumes:
  caddy_data:
  caddy_config:


networks:
  default:
    # Explicit declaration required by podman-compose; Docker Compose would
    # create this implicitly, but older podman-compose versions do not.
    driver: bridge
  authentik_network:
    # Shared network for Authentik server/worker/db/redis and the MoE app.
    # Created automatically when the "authentik" profile is active.
    driver: bridge
  chroma_internal:
    # Egress-blocked network for ChromaDB (CVE-2026-45829 defence-in-depth):
    # internal=true removes the gateway, so the chromadb server cannot reach the
    # internet to download a malicious model repo (the RCE's delivery step).
    # Only services also attached here (the orchestrator) can talk to it.
    internal: true
    driver: bridge
  rust_compile_internal:
    # Egress-blocked network for rust-compile-sandbox: internal=true removes
    # the gateway, so a compiler invocation on untrusted, model-generated
    # source can never reach the internet. Only mcp-precision (also attached
    # here) can reach it, by its `rust-compile-sandbox` DNS name.
    internal: true
    driver: bridge
  rust_loom_internal:
    # Egress-blocked network for rust-loom-sandbox, same rationale as
    # rust_compile_internal above -- this one matters even more, since this
    # container actually executes the submitted code instead of only
    # type-checking it.
    internal: true
    driver: bridge
